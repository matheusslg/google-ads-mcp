[project]
name = "google-ads-mcp"
version = "0.0.1"
description = "Workflow-shaped MCP server exposing the Google Ads API to AI agents with built-in safety rails for mutations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matheus Nascimento Cavallini", email = "nascimentocavallini@hotmail.com" }
]
keywords = ["mcp", "google-ads", "ai", "claude", "fastmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0",
    "google-ads>=24,<25",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.urls]
Homepage   = "https://github.com/matheusslg/google-ads-mcp"
Repository = "https://github.com/matheusslg/google-ads-mcp"
Issues     = "https://github.com/matheusslg/google-ads-mcp/issues"

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# SDK ships no py.typed marker as of v24; suppress import-untyped noise.
[[tool.mypy.overrides]]
module = "google.ads.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google_auth_oauthlib.*"
ignore_missing_imports = true
